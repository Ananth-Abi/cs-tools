<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo-dark.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo-white.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSM Portal</title>
    <script src="/config.js"></script>
    <style>
      /*
       * Boot loading screen: styled inline (no framework, no external
       * stylesheet) so it can render before any bundled CSS/JS has loaded.
       * Removed by the inline script below once React has mounted.
       */
      #csm-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #csm-boot-loader {
          background: #16181d;
        }
      }
      #csm-boot-loader img {
        width: 48px;
        height: 48px;
      }
      #csm-boot-loader .csm-boot-track {
        width: 220px;
        height: 4px;
        border-radius: 2px;
        background: rgba(127, 127, 127, 0.25);
        overflow: hidden;
      }
      #csm-boot-loader .csm-boot-bar {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: #ff7300;
        transition: width 0.15s ease-out;
      }
      /* Indeterminate fallback, used when the entry script's response has no
         Content-Length (e.g. behind gzip/CDN compression that strips it) so
         real byte-progress can't be computed. */
      #csm-boot-loader .csm-boot-track.csm-boot-indeterminate .csm-boot-bar {
        width: 40%;
        transition: none;
        animation: csm-boot-indeterminate 1.1s ease-in-out infinite;
      }
      @keyframes csm-boot-indeterminate {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      #csm-boot-loader .csm-boot-label {
        font-size: 13px;
        color: #6b7280;
      }
      #csm-boot-loader.csm-boot-hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="csm-boot-loader" role="status" aria-live="polite">
      <img src="/logo-dark.svg" alt="" />
      <div class="csm-boot-track" id="csm-boot-track">
        <div class="csm-boot-bar" id="csm-boot-bar"></div>
      </div>
      <div class="csm-boot-label" id="csm-boot-label">Loading…</div>
    </div>

    <script>
      // Plain, framework-free boot script. Runs before the app's own JS has
      // loaded, so it can't import anything from the app — everything it
      // needs is inline here or in the <style> block above.
      (function () {
        var loader = document.getElementById("csm-boot-loader");
        var bar = document.getElementById("csm-boot-bar");
        var track = document.getElementById("csm-boot-track");
        var label = document.getElementById("csm-boot-label");
        if (!loader || !bar || !track || !label) return;

        function setProgress(fraction) {
          var pct = Math.max(0, Math.min(1, fraction)) * 100;
          bar.style.width = pct + "%";
        }

        function goIndeterminate() {
          track.classList.add("csm-boot-indeterminate");
        }

        function hideLoader() {
          if (!loader) return;
          loader.classList.add("csm-boot-hidden");
          window.setTimeout(function () {
            loader.remove();
          }, 250);
        }

        // React signals it has mounted by dispatching this event (see
        // src/utils/appMountedEvent.ts, useAppMountedSignal/APP_MOUNTED_EVENT,
        // called from App.tsx). If that never
        // fires (e.g. the app fails before mounting), the loader is left in
        // place rather than hidden on a guess — an app that never mounted
        // has nothing useful to show underneath it anyway.
        window.addEventListener("csm:app-mounted", hideLoader, { once: true });

        // Vite hoists/relocates the entry `<script type="module">` and does
        // not preserve custom attributes/ids on it, so it has to be found by
        // shape, not by id.
        var entryScript = document.querySelector(
          'script[type="module"][src]',
        );
        if (!entryScript) {
          // No module entry to track (unexpected build shape) — fall back to
          // an indeterminate bar so there's still visible motion.
          goIndeterminate();
          return;
        }

        var src = entryScript.getAttribute("src");

        fetch(src)
          .then(function (response) {
            if (!response.ok || !response.body) {
              goIndeterminate();
              return;
            }
            var contentLength = response.headers.get("Content-Length");
            var total = contentLength ? parseInt(contentLength, 10) : 0;
            if (!total || Number.isNaN(total)) {
              // Common under gzip/CDN compression, which strips
              // Content-Length (or reports the compressed size, not the
              // decoded size actually being streamed) — no reliable total
              // to compute a real fraction against.
              goIndeterminate();
              return;
            }

            var received = 0;
            var reader = response.body.getReader();

            function pump() {
              return reader.read().then(function (result) {
                if (result.done) {
                  setProgress(1);
                  return;
                }
                received += result.value ? result.value.length : 0;
                setProgress(received / total);
                return pump();
              });
            }

            return pump();
          })
          .catch(function () {
            // A network hiccup on this tracking fetch must not block the
            // real module load (the browser's own <script type="module">
            // tag fetches and runs it independently) — just fall back to
            // showing indeterminate motion.
            goIndeterminate();
          });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
